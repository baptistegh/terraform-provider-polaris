name: Release

# release-please keeps a "chore(main): release x.y.z" PR up to date from the
# conventional commits on main. Merging that PR creates the tag and a *draft*
# GitHub release with the changelog; GoReleaser then builds, signs and uploads
# the artifacts to that draft, and only then is it published. The Terraform
# Registry ingests a version when its release is published, so publishing
# last guarantees the artifacts are there.

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # release-please manages its PR labels

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # release-please runs with a GitHub App installation token, not the default
      # GITHUB_TOKEN or a PAT:
      # - PRs opened with GITHUB_TOKEN do not trigger CI, so the required checks
      #   would never run on the release PR;
      # - commits GitHub Apps create through the API are signed by GitHub, which
      #   the "Require signed commits" rule on main needs (PAT commits are not).
      # Setup: repository variable RELEASE_PLEASE_APP_CLIENT_ID and secret
      # RELEASE_PLEASE_APP_PRIVATE_KEY, from an app installed on this repository
      # with Contents, Pull requests and Issues read & write.
      - name: Check release app configuration
        env:
          CLIENT_ID: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::Missing the release-please GitHub App: set the RELEASE_PLEASE_APP_CLIENT_ID repository variable and the RELEASE_PLEASE_APP_PRIVATE_KEY secret."
            exit 1
          fi

      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
